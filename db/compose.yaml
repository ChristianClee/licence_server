services:
  mysql:
    image: mysql:latest
    container_name: ilyaMysql
    environment:
      MYSQL_ROOT_PASSWORD: 123
    ports:
      - "3307:3306"
    volumes:
      - my-db-volume:/var/lib/mysql
      - ./dumps/01_dump_tables_init.sql:/docker-entrypoint-initdb.d/01_dump_tables_init.sql:ro
      - ./dumps/02_dump_nessasary_insert.sql:/docker-entrypoint-initdb.d/02_dump_nessasary_insert.sql:ro
      - ./dumps/03_dump_testing_insert.sql:/docker-entrypoint-initdb.d/03_dump_testing_insert.sql

volumes:
  my-db-volume: