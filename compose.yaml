services:
  mysql:
    image: mysql:latest
    container_name: ilyaMysql
    environment:
      MYSQL_ROOT_PASSWORD: 123
    ports:
      - "3307:3306"
    volumes:
      - my-db-volume:/var/lib/mysql
      - ./db/dumps/01_dump_tables_init.sql:/docker-entrypoint-initdb.d/01_dump_tables_init.sql:ro
      - ./db/dumps/02_dump_nessasary_insert.sql:/docker-entrypoint-initdb.d/02_dump_nessasary_insert.sql:ro
      - ./db/dumps/03_dump_testing_insert.sql:/docker-entrypoint-initdb.d/03_dump_testing_insert.sql

  nginx:
    image: nginx:alpine
    container_name: ilyaNginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./front/testing_dashboard:/usr/share/nginx/html:ro
    depends_on:
      - mysql

volumes:
  my-db-volume:
